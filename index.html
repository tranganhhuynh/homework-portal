<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ms Anh’s Homework Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f9ff;--surf:#fff;--ink:#2b2f4a;--mute:#66708f;--line:#cfe3f3;--acc:#ffcf33;--acc-ink:#2b2f4a;--link:#2f5bd8;--late:#d6455d;--ok:#1b8f5a;--warn:#b87400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(#d9f0ff,var(--bg) 280px) no-repeat var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top b{font-weight:800;font-size:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);padding:8px 14px;border-radius:8px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:#f2a900;font-weight:600;box-shadow:0 3px 0 #f2a900}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
textarea{min-height:160px;resize:vertical}
label{display:block;font-weight:600;margin:12px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;padding:10px 14px;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--ink);background:var(--acc);border-radius:10px 10px 0 0;font-weight:600}
.panel{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 0 #dcecf8}
.login{max-width:520px;margin:8vh auto 0}.login h1{font-size:clamp(1.1rem,5.4vw,2rem);white-space:nowrap}
.login p{color:var(--mute)}
.hint{margin-top:18px;font-size:.9rem;color:var(--mute);border-top:1px dashed var(--line);padding-top:12px}
.task{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border:0}
.task:hover h3{color:var(--link)}
.sub{color:var(--mute);font-size:.9rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.s-todo{color:var(--mute)}.s-draft{color:var(--warn)}.s-submitted{color:var(--ok)}.s-late{color:var(--late)}.s-overdue{color:var(--late);background:color-mix(in srgb,var(--late) 12%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}h1{font-size:1.9rem}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}
td button{padding:3px 9px;font-size:.85rem}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q label.o{display:flex;gap:8px;font-weight:400;margin:4px 0}.q label.o input{width:auto}
.right{color:var(--ok);font-weight:600}.wrong{color:var(--late);font-weight:600}
.saved{font-size:.85rem;color:var(--mute)}
a{color:var(--link)}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-bottom:16px}
.vocab td:first-child{font-weight:600}
.empty{color:var(--mute);padding:14px 0}
@media print{:root:root:root{--bg:#fff;--surf:#fff;--ink:#000;--mute:#444;--line:#999;--late:#a00;--ok:#060;--warn:#850;color-scheme:light}.noprint,.tabs,.top{display:none!important}.wrap{padding:0}.panel{border:0;padding:0}}
.rep h2{margin-bottom:4px}.rep .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}.rep .stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px}.rep .stat b{display:block;font-size:1.5rem}.rep .cm{border-left:4px solid var(--acc);padding:4px 14px;margin-top:16px;white-space:pre-wrap}
.chip{display:inline-block;padding:2px 14px;border-radius:99px;font-weight:600;font-size:.95rem;color:#2b2f4a}
button.lv{border-radius:99px;padding:5px 16px}button.lv.on{background:var(--acc);border-color:#f2a900;font-weight:600}
.res{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.res:last-child{border:0}summary{cursor:pointer}
.pick{display:flex;gap:6px;align-items:center;font-weight:400;margin:2px 12px 2px 0}.pick input{width:auto}details.acc{margin-top:6px}
.tick{color:var(--ok);font-weight:800;font-size:1.15rem}
.tg{width:36px;height:36px;padding:0;border-radius:8px;font-weight:800;font-size:1.1rem;color:var(--ok)}.tg.on{background:#e3f7ec;border-color:var(--ok)}
.nb{padding:1px 9px;font-size:.78rem;margin-left:5px;border-radius:99px}.nb.has{background:var(--acc);border-color:#f2a900;font-weight:600}.rnote{margin-top:6px;padding:8px 12px;background:#fff8d6;border-radius:10px;font-size:.95rem}
.q{padding:16px 0}.q h3{margin:0 0 10px;line-height:1.45}.q input[data-fill],.q textarea[data-fill]{margin-top:4px}
.eye{padding:3px 7px;line-height:0;vertical-align:middle}.pinv{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.adot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c4cbd9;margin-right:7px}.adot.on{background:var(--ok);box-shadow:0 0 0 3px #d9f3e6}
.vocab td{white-space:pre-line;vertical-align:top}
.qtxt{white-space:pre-wrap;background:#f6fbff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px}img.qpic{max-width:100%;max-height:360px;border-radius:10px;display:block;margin:0 0 10px}details.qx{margin-top:10px}details.qx summary{cursor:pointer;font-weight:600}
a.btn{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--acc);color:var(--acc-ink);border:1px solid #f2a900;box-shadow:0 3px 0 #f2a900;font-weight:700;text-decoration:none}
.aud{margin:0 0 10px}.aud audio{width:100%;max-width:520px}
.exbar{display:flex;justify-content:flex-end;margin-bottom:6px}
#exwrap.fs{position:fixed;inset:0;z-index:100;background:var(--bg);padding:10px;display:flex;flex-direction:column}
#exwrap.fs iframe{flex:1;height:auto!important}
#exwrap:fullscreen{background:var(--bg);padding:10px;display:flex;flex-direction:column}
#exwrap:fullscreen iframe{flex:1;height:auto!important}
#exwrap:-webkit-full-screen{background:var(--bg);padding:10px;display:flex;flex-direction:column}
#exwrap:-webkit-full-screen iframe{flex:1;height:auto!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const KEY="hw_portal_demo_v1";
const day=86400000, iso=d=>new Date(d).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seed=()=>({
 teacher:{name:"Teacher",pin:"0000"},
 students:[{id:"s1",name:"Linh",pin:"1111"},{id:"s2",name:"Minh",pin:"2222"},{id:"s3",name:"Anh",pin:"3333"}],
 tasks:[
  {id:"t1",title:"Vocabulary quiz: Travel",due:iso(Date.now()+2*day),kind:"quiz",desc:"Answer all questions, then submit.",assigned:["s1","s2","s3"],
   quiz:[{q:"We missed our ___ because of the delay.",t:"mc",o:["connection","reaction","collection"],a:0},{q:"A ticket you can use there and back is a ___ ticket.",t:"fill",a:"return"},{q:"Which word means a long journey by sea?",t:"mc",o:["voyage","commute","stroll"],a:0}]},
  {id:"t2",title:"Writing: My dream holiday",due:iso(Date.now()-1*day),kind:"text",desc:"Write 120–150 words. Use at least five words from the Travel list.",assigned:["s1","s2"]},
  {id:"t3",title:"Writing: A day I will never forget",due:iso(Date.now()+6*day),kind:"text",desc:"Write 150 words about a memorable day. Use past tenses.",assigned:["s2","s3"]}],
 subs:{"t2_s1":{text:"My dream holiday is a trip to Japan…",status:"submitted",at:Date.now()-2*day},"t2_s2":{text:"I want to go to the beach and…",status:"draft"}},
 vocab:[{w:"journey",m:"a trip from one place to another"},{w:"luggage",m:"bags and suitcases you take when travelling"},{w:"destination",m:"the place where you are going"},{w:"itinerary",m:"a detailed plan of a trip"}],
 links:[{label:"Anki deck: Travel vocabulary",url:"https://apps.ankiweb.net/"},{label:"Quizlet set: Travel words",url:"https://quizlet.com/"}]
});
let S,user=null,tab="todo",open=null,view=null;

S={teacher:{name:"Teacher"},students:[],tasks:[],subs:{},res:[],levels:[],vocab:[],links:[]};
if(!S.levels)S.levels=["Starters","Movers","Flyers","KET","PET","IELTS"];
if(!S.res){S.res=[];if((S.vocab||[]).length)S.res.push({id:"r0",level:"Starters",type:"vocab",title:"Travel words",words:S.vocab});
 (S.links||[]).forEach((l,i)=>S.res.push({id:"rl"+i,level:"Starters",type:"link",title:l.label,url:l.url}));
 S.res.push({id:"rg1",level:"Movers",type:"link",title:"Example: Spelling practice (replace with your link)",url:"https://docs.google.com/"},{id:"rg2",level:"KET",type:"link",title:"Example: Reading worksheet (Google Doc)",url:"https://docs.google.com/"})}
const dl={Linh:"Starters",Minh:"Movers",Anh:"KET"};S.students.forEach(s=>{if(s.level===undefined)s.level=dl[s.name]||""});
S.res.forEach(r=>{if(!Array.isArray(r.to)){if((r.to==="level"||!r.to)&&r.level&&r.level!=="General")r.to=S.students.filter(s=>s.level===r.level).map(s=>s.id);else r.to="all"}});
let st;const save=()=>{clearTimeout(st);st=setTimeout(pushAll,700)};
const endDay=d=>new Date(d+"T23:59:59").getTime();
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const sub=(t,s)=>S.subs[t+"_"+s]||{};
function status(t,sid){const b=sub(t.id,sid);
 if(b.status==="submitted")return b.at>endDay(t.due)?["late","Submitted late"]:["submitted","Submitted"];
 if(Date.now()>endDay(t.due))return["overdue","Overdue"];
 const has=b.hs||(b.text&&b.text.trim())||(b.ans&&b.ans.some(x=>x!==null&&x!==""&&x!==undefined));
 return has?["draft","Draft saved"]:["todo","To do"];}
const badge=(s)=>`<span class="badge s-${s[0]}">${s[1]}</span>`;


function render(){
 const el=document.getElementById("app");
 if(!user){rview=null;el.innerHTML=loginHTML();bind();bind5();return}
 el.innerHTML=`<div class="top"><b>Ms Anh’s Homework Portal</b>${topRight()}</div>`+(user.preview?`<div class="note" role="status">Read-only preview of what ${esc(user.name)} sees. Typing and submitting are turned off, and nothing is saved.</div>`:"")+(user.role==="teacher"?teacherHTML():studentHTML())+(view?modal():"");
 if(user.preview)freeze();
 bind();bind2();bind3();bind4();bind5();bind6();bindVocab();bind7();bind8();bind9();bind10();bind11();bind12();bind13();bind14();trackOpen();
}
function loginHTML(){return `<div class="login"><h1>Ms Anh’s Homework Portal</h1><p>Log in with your name and PIN.</p>
<div class="panel"><label for="n">Name</label><input id="n" autocomplete="username"><label for="p">PIN</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password">
<p id="err" class="wrong" role="alert"></p><button class="p" id="go">Log in</button>
<div class="hint">Forgot your PIN? Ask Ms Anh.</div></div></div>`}

function studentHTML(){
 const id=user.id;
 const work=open?S.tasks.find(t=>t.id===open):null;if(open&&!work){open=null;if(tab==="work")tab="todo"}
 const mine=S.tasks.filter(t=>t.assigned.includes(id)&&!t.archived).sort((a,b)=>a.due.localeCompare(b.due));
 const doneSt=x=>["submitted","late"].includes(status(x,id)[0])&&!sub(x.id,id).retry;
 const todo=mine.filter(t=>!doneSt(t)),done=mine.filter(doneSt);
 const list=a=>a.length?a.map(t=>`<div class="task" data-open="${t.id}" tabindex="0" role="button"><div><h3>${esc(t.title)}</h3><div class="sub">Due ${fmt(t.due)}</div></div>${sub(t.id,id).retry?`<span class="badge s-draft">Redo</span>`:badge(status(t,id))}</div>`).join(""):`<div class="empty">Nothing here.</div>`;
 return `<div class="tabs"><button data-tab="todo" class="${tab==="todo"?"on":""}">To-do (${todo.length})</button><button data-tab="done" class="${tab==="done"?"on":""}">Submitted</button><button data-tab="prog" class="${tab==="prog"?"on":""}">My progress</button><button data-tab="res" class="${tab==="res"?"on":""}">Resources</button>${work?`<button data-tab="work" class="${tab==="work"?"on":""}">Doing: ${esc(work.title.length>22?work.title.slice(0,20)+"…":work.title)}</button>`:""}</div>`+
 (tab==="work"&&work?wordSearchHTML()+taskHTML(work,id):tab==="todo"?`<div class="panel">${list(todo)}</div>`:tab==="done"?`<div class="panel">${list(done)}</div>`:tab==="prog"?myProgressHTML():resStudent());
}
function taskHTMLold(t,id){
 const b=sub(t.id,id),fin=b.status==="submitted",st=status(t,id);
 let body="";
 if(t.kind==="text"){body=`<label for="tx">Your answer</label><textarea id="tx" ${fin?"disabled":""}>${esc(b.text||"")}</textarea><div class="saved" id="sv">${fin?"":"Drafts save automatically."}</div>`}
 else body=t.quiz.map((q,i)=>{const a=(b.ans||[])[i];
  const res=fin?(q.t==="mc"?a===q.a:String(a||"").trim().toLowerCase()===q.a.toLowerCase()):null;
  return `<div class="q">${qExtra(q,i,t.quiz[i-1])}<h3>${i+1}. ${esc(q.q)}</h3>`+(q.t==="mc"?q.o.map((o,j)=>`<label class="o"><input type="radio" name="q${i}" value="${j}" ${a===j?"checked":""} ${fin?"disabled":""}>${esc(o)}</label>`).join(""):`<input data-fill="${i}" value="${esc(a||"")}" aria-label="Answer ${i+1}" ${fin?"disabled":""}>`)+
  (fin?`<div class="${res?"right":"wrong"}">${res?"Correct":"Not quite. Answer: "+esc(q.t==="mc"?q.o[q.a]:q.a)}</div>`:"")+`</div>`}).join("");
 return `<p><button id="back">Back to list</button></p><div class="panel"><div class="row" style="justify-content:space-between"><h2>${esc(t.title)}</h2>${badge(st)}</div><p class="sub">Due ${fmt(t.due)}</p><p>${esc(t.desc)}</p>${body}
 ${fin?(t.kind==="quiz"?`<p><b>Score: ${score(t,b)} / ${t.quiz.length}</b></p>`:`<p class="sub">Submitted on ${new Date(b.at).toLocaleString("en-GB")}.</p>`):`<p><button class="p" id="submit">Submit homework</button></p>`}</div>`;
}
function resHTML(edit){
 return `<div class="grid2"><div class="panel"><h2>Vocabulary</h2><div class="scroll"><table class="vocab"><tbody>${S.vocab.map((v,i)=>`<tr><td>${esc(v.w)}</td><td>${esc(v.m)}</td>${edit?`<td><button data-delv="${i}" aria-label="Delete ${esc(v.w)}">Delete</button></td>`:""}</tr>`).join("")||`<tr><td class="empty">No words yet.</td></tr>`}</tbody></table></div>
 ${edit?`<label for="vw">New word</label><input id="vw"><label for="vm">Meaning</label><input id="vm"><p><button id="addv" class="p">Add word</button></p>`:""}</div>
 <div class="panel"><h2>Study links</h2>${S.links.map((l,i)=>`<p><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>${edit?` <button data-dell="${i}">Delete</button>`:""}</p>`).join("")||`<div class="empty">No links yet.</div>`}
 ${edit?`<label for="ll">Label</label><input id="ll"><label for="lu">URL</label><input id="lu" placeholder="https://"><p><button id="addl" class="p">Add link</button></p>`:""}</div></div>`}

function teacherHTML(){
 const tabs=[["ov","Overview"],["qb","Create exercise"],["lib","Library"],["stu","Students"],["prog","Progress"],["rep","Parent reports"],["set","Settings"]];
 let h=`<div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div>`;
 if(tab==="ov"||tab==="todo"){
  h+=activeHTML()+overviewHTML();
 }else if(tab==="stu"){
  h+=`<div class="panel"><h2>Students</h2><div class="scroll"><table><thead><tr><th>Name</th><th>PIN</th><th>Status</th><th>Open tasks</th><th>Late or overdue</th><th></th></tr></thead><tbody>`+S.students.map(s=>{const m=S.tasks.filter(t=>t.assigned.includes(s.id)&&!t.archived);return `<tr><td>${esc(s.name)}</td>${pinCell(s)}<td data-st="${s.id}">${statusInner(s)}</td><td>${m.filter(t=>!["submitted","late"].includes(status(t,s.id)[0])).length}</td><td>${m.filter(t=>["late","overdue"].includes(status(t,s.id)[0])).length}</td><td><button data-spin="${s.id}">Change PIN</button> <button data-sdel="${s.id}">Remove</button></td></tr>`}).join("")+`</tbody></table></div>
  <h3 style="margin-top:18px">Add a student</h3><div class="grid2"><div><label for="stn">Name</label><input id="stn"></div><div><label for="stp">PIN (at least 6 characters)</label><input id="stp" autocomplete="off"></div></div><p><button class="p" id="addst">Add student</button></p></div>`;
 }else if(tab==="rep"){h+=repHTML()}else if(tab==="qb"){h+=qbHTML()}else if(tab==="lib"){h+=libHTML()}else if(tab==="prog"){h+=progressHTML()}else if(tab==="set"){h+=settingsHTML()}else h+=resTeacher();
 return h;
}
let rep={sid:"",from:iso(new Date().setDate(1)),to:iso(Date.now()),comment:"",show:false};
function repBodyOld(){
 const s=S.students.find(x=>x.id===rep.sid);if(!s)return"";
 const ts=S.tasks.filter(t=>t.assigned.includes(s.id)&&t.due>=rep.from&&t.due<=rep.to).sort((a,b)=>a.due.localeCompare(b.due));
 const st=ts.map(t=>({t,s:status(t,s.id)})),c=k=>st.filter(x=>x.s[0]===k).length;
 const sc=st.filter(x=>x.t.kind==="quiz"&&sub(x.t.id,s.id).status==="submitted").map(x=>score(x.t,sub(x.t.id,s.id))/x.t.quiz.length);
 const avg=sc.length?Math.round(100*sc.reduce((a,b)=>a+b,0)/sc.length)+"%":"n/a";
 const stat=(n,l)=>`<div class="stat"><b>${n}</b>${l}</div>`;
 return `<h2>Progress report: ${esc(s.name)}</h2><div class="sub">${fmt(rep.from)} to ${fmt(rep.to)} · prepared ${new Date().toLocaleDateString("en-GB")}</div>
 <div class="stats">${stat(ts.length,"Assigned")}${stat(c("submitted"),"On time")}${stat(c("late"),"Late")}${stat(c("overdue"),"Missing")}${stat(avg,"Average score")}</div>
 <div class="scroll"><table><thead><tr><th>Assignment</th><th>Due</th><th>Status</th><th>Score</th></tr></thead><tbody>${st.map(x=>{const b=sub(x.t.id,s.id);return `<tr><td>${esc(x.t.title)}</td><td>${fmt(x.t.due)}</td><td>${x.s[1]}</td><td>${x.t.kind==="quiz"&&b.status==="submitted"?score(x.t,b)+" / "+x.t.quiz.length:"–"}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">No assignments due in this period.</td></tr>`}</tbody></table></div>
 ${rep.comment.trim()?`<div class="cm"><b>Teacher’s comment</b><br>${esc(rep.comment)}</div>`:""}`;
}
function repHTMLold(){
 return `<div class="panel noprint"><h2>Parent report</h2><div class="grid2"><div><label for="rs">Student</label><select id="rs"><option value="">Choose a student</option>${S.students.map(s=>`<option value="${s.id}" ${rep.sid===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div><div class="row"><div style="flex:1"><label for="rf">From</label><input id="rf" type="date" value="${rep.from}"></div><div style="flex:1"><label for="rt">To</label><input id="rt" type="date" value="${rep.to}"></div></div></div>
 <label for="rc">Your comment for the parents</label><textarea id="rc" style="min-height:90px">${esc(rep.comment)}</textarea>
 <p><button class="p" id="rg">Preview report</button></p></div>`+(rep.show&&rep.sid?`<div class="panel rep" style="margin-top:16px">${repBody()}</div><p class="noprint row"><button class="p" id="rp">Print / save as PDF</button><button id="rd">Download report file</button></p><p class="sub noprint">In the print window, choose “Save as PDF” as the printer. If printing is blocked, download the file and open it in your browser, then print from there.</p>`:"");
}
function isRight(q,a){if(q.t==="open")return true;if(q.t==="mc")return a===q.a;return String(q.a).split("|").some(x=>nrm(x)===nrm(a))}
function score(t,b){return b.score??0}
const retries=b=>Math.max(0,((b.history&&b.history.length)||b.attempts||1)-1);
const roundRetries=b=>Math.max(0,(b.attempts||1)-1);

 if($("#back"))$("#back").onclick=()=>{open=null;tab="todo";render()};
 const t=open&&S.tasks.find(x=>x.id===open);
 if(t){const k=t.id+"_"+user.id;
  const ens=()=>S.subs[k]=S.subs[k]||{};
  if($("#tx"))$("#tx").oninput=e=>{ens().text=e.target.value;save();$("#sv").textContent="Draft saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
  $$("input[type=radio]").forEach(r=>r.onchange=()=>{const b=ens();b.ans=b.ans||[];b.ans[+r.name.slice(1)]=+r.value;save()});
  $$("[data-fill]").forEach(r=>r.oninput=()=>{const b=ens();b.ans=b.ans||[];b.ans[+r.dataset.fill]=r.value;save()});
  if($("#submit"))$("#submit").onclick=()=>{const b=ens();b.status="submitted";b.at=Date.now();save();render()};
 }
 if($("#go")){const go=()=>{const n=$("#n").value.trim().toLowerCase(),p=$("#p").value.trim();
   if(n===S.teacher.name.toLowerCase()&&p===S.teacher.pin){user={name:"Teacher",role:"teacher"};tab="ov"}
   else{const s=S.students.find(x=>x.name.toLowerCase()===n&&x.pin===p);if(!s){$("#err").textContent="Name or PIN doesn’t match. Check both and try again.";return}user={...s,role:"student"};tab="todo"}render()};
  $("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key==="Enter")go()}}
 if($("#adds"))$("#adds").onclick=()=>{const n=$("#sn").value.trim(),p=$("#sp").value.trim();if(!n||!p){alert("Enter a name and a PIN.");return}S.students.push({id:"s"+Date.now(),name:n,pin:p,level:$("#sl")?$("#sl").value:""});save();render()};
 $$("[data-dels]").forEach(b=>b.onclick=()=>{if(confirm("Remove this student and their work?")){const id=b.dataset.dels;S.students=S.students.filter(s=>s.id!==id);S.tasks.forEach(t=>t.assigned=t.assigned.filter(x=>x!==id));S.res.forEach(r=>{if(Array.isArray(r.to))r.to=r.to.filter(x=>x!==id);if(r.notes)delete r.notes[id]});save();render()}});
 if($("#addv"))$("#addv").onclick=()=>{const w=$("#vw").value.trim();if(!w)return;S.vocab.push({w,m:$("#vm").value.trim()});save();render()};
 if($("#addl"))$("#addl").onclick=()=>{const l=$("#ll").value.trim(),u=$("#lu").value.trim();if(!l||!/^https?:\/\//.test(u)){alert("Add a label and a URL starting with https://");return}S.links.push({label:l,url:u});save();render()};
 $$("[data-delv]").forEach(b=>b.onclick=()=>{S.vocab.splice(+b.dataset.delv,1);save();render()});
 $$("[data-dell]").forEach(b=>b.onclick=()=>{S.links.splice(+b.dataset.dell,1);save();render()});
 $$("[data-pin]").forEach(b=>b.onclick=()=>{const p=prompt("New PIN for this student:");if(p&&p.trim()){S.students.find(s=>s.id===b.dataset.pin).pin=p.trim();save();render()}});
 if($("#rg")){const rd=()=>{rep.sid=$("#rs").value;rep.from=$("#rf").value;rep.to=$("#rt").value;rep.comment=$("#rc").value};
  $("#rg").onclick=()=>{rd();if(!rep.sid){alert("Choose a student first.");return}if(rep.from>rep.to){alert("The start date must be before the end date.");return}rep.show=true;render()};
  $("#rs").onchange=()=>{rd();rep.show=false;render()};
  if($("#rp"))$("#rp").onclick=()=>{rd();try{window.print()}catch(e){alert("Printing is blocked here. Use Download report file instead.")}};
  if($("#rd"))$("#rd").onclick=async()=>{rd();try{const d=await claude.use("downloads");if(!d){alert("Downloads are not available in this view.");return}
   const nm=S.students.find(s=>s.id===rep.sid).name;
   const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Report ${esc(nm)}</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;color:#111}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:8px;text-align:left}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat{border:1px solid #ccc;border-radius:8px;padding:8px 12px}.stat b{display:block;font-size:1.4rem}.cm{border-left:4px solid #3b4cca;padding:4px 14px;margin-top:16px;white-space:pre-wrap}.sub{color:#555}</style></head><body>${repBody()}</body></html>`;
   await d.save({filename:"report-"+nm.replace(/\W+/g,"-")+"-"+rep.to+".html",data:html})}catch(e){}};
 }
}
render();
(async()=>{try{if(!sb)return;const{data}=await sb.auth.getSession();if(data.session)await loadAll(data.session.user.id)}catch(e){}})();
</script>
</body>
</html>
