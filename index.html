<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f9ff;--surf:#fff;--ink:#2b2f4a;--mute:#66708f;--line:#cfe3f3;--acc:#ffcf33;--acc-ink:#2b2f4a;--link:#2f5bd8;--late:#d6455d;--ok:#1b8f5a;--warn:#b87400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(#d9f0ff,var(--bg) 280px) no-repeat var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);padding:8px 14px;border-radius:8px}

label{display:block;font-weight:600;margin:12px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;padding:10px 14px;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--ink);background:var(--acc);border-radius:10px 10px 0 0;font-weight:600}
.panel{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 0 #dcecf8}
.login{max-width:520px;margin:8vh auto 0}.login h1{font-size:clamp(1.1rem,5.4vw,2rem);white-space:nowrap}
.login p{color:var(--mute)}
.hint{margin-top:18px;font-size:.9rem;color:var(--mute);border-top:1px dashed var(--line);padding-top:12px}
.task{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border:0}
.task:hover h3{color:var(--link)}

.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.s-todo{color:var(--mute)}.s-draft{color:var(--warn)}.s-submitted{color:var(--ok)}.s-late{color:var(--late)}.s-overdue{color:var(--late);background:color-mix(in srgb,var(--late) 12%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}

.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q label.o{display:flex;gap:8px;font-weight:400;margin:4px 0}.q label.o input{width:auto}
.right{color:var(--ok);font-weight:600}.wrong{color:var(--late);font-weight:600}

a{color:var(--link)}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-bottom:16px}
.vocab td:first-child{font-weight:600}
.empty{color:var(--mute);padding:14px 0}
@media print{:root:root:root{--bg:#fff;--surf:#fff;--ink:#000;--mute:#444;--line:#999;--late:#a00;--ok:#060;--warn:#850;color-scheme:light}.noprint,.tabs,.top{display:none!important}.wrap{padding:0}.panel{border:0;padding:0}}
.rep h2{margin-bottom:4px}.rep .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}.rep .stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px}.rep .stat b{display:block;font-size:1.5rem}.rep .cm{border-left:4px solid var(--acc);padding:4px 14px;margin-top:16px;white-space:pre-wrap}
.chip{display:inline-block;padding:2px 14px;border-radius:99px;font-weight:600;font-size:.95rem;color:#2b2f4a}
button.lv{border-radius:99px;padding:5px 16px}button.lv.on{background:var(--acc);border-color:#f2a900;font-weight:600}
.res{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.res:last-child{border:0}summary{cursor:pointer}
.pick{display:flex;gap:6px;align-items:center;font-weight:400;margin:2px 12px 2px 0}.pick input{width:auto}details.acc{margin-top:6px}
.tick{color:var(--ok);font-weight:800;font-size:1.15rem}
.tg{width:36px;height:36px;padding:0;border-radius:8px;font-weight:800;font-size:1.1rem;color:var(--ok)}.tg.on{background:#e3f7ec;border-color:var(--ok)}
.nb{padding:1px 9px;font-size:.78rem;margin-left:5px;border-radius:99px}.nb.has{background:var(--acc);border-color:#f2a900;font-weight:600}.rnote{margin-top:6px;padding:8px 12px;background:#fff8d6;border-radius:10px;font-size:.95rem}
.q{padding:16px 0}.q h3{margin:0 0 10px;line-height:1.45}.q input[data-fill],.q textarea[data-fill]{margin-top:4px}
.eye{padding:3px 7px;line-height:0;vertical-align:middle}.pinv{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.adot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c4cbd9;margin-right:7px}.adot.on{background:var(--ok);box-shadow:0 0 0 3px #d9f3e6}
.vocab td{white-space:pre-line;vertical-align:top}
.qtxt{white-space:pre-wrap;background:#f6fbff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px}img.qpic{max-width:100%;max-height:360px;border-radius:10px;display:block;margin:0 0 10px}details.qx{margin-top:10px}details.qx summary{cursor:pointer;font-weight:600}
a.btn{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--acc);color:var(--acc-ink);border:1px solid #f2a900;box-shadow:0 3px 0 #f2a900;font-weight:700;text-decoration:none}
.aud{margin:0 0 10px}.aud audio{width:100%;max-width:520px}
.exbar{display:flex;justify-content:flex-end;margin-bottom:6px}
#exwrap.fs{position:fixed;inset:0;z-index:100;background:var(--bg);padding:10px;display:flex;flex-direction:column}
#exwrap.fs iframe{flex:1;height:auto!important}
#exwrap:fullscreen{background:var(--bg);padding:10px;display:flex;flex-direction:column}
#exwrap:fullscreen iframe{flex:1;height:auto!important}
#exwrap:-webkit-full-screen{background:var(--bg);padding:10px;display:flex;flex-direction:column}
#exwrap:-webkit-full-screen iframe{flex:1;height:auto!important}
.fmtbar{display:flex;gap:4px;margin:6px 0 4px}.fmtbar button{padding:2px 10px;min-width:36px}
.fmtprev{border:1px dashed var(--line);border-radius:8px;padding:6px 12px;margin-top:4px;background:var(--surf)}
.blk h3{margin:0 0 8px}#totop{width:44px;height:44px;padding:0!important;font-size:20px;line-height:1;position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:99px;padding:10px 16px;background:var(--acc);color:var(--acc-ink);border:1px solid #f2a900;box-shadow:0 3px 0 #f2a900;font-weight:700}#totop[hidden]{display:none}#tobot{width:44px;height:44px;padding:0!important;font-size:20px;line-height:1;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:99px;padding:10px 16px;background:var(--acc);color:var(--acc-ink);border:1px solid #f2a900;box-shadow:0 3px 0 #f2a900;font-weight:700}#tobot[hidden]{display:none}
@media print{#totop,#tobot{display:none!important}}
.rdesc{margin-top:6px}
.prevans{background:#fff4f2;border:1px solid var(--late);border-radius:10px;padding:6px 12px;margin:0 0 10px}
.row>*{min-width:0}
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;min-height:44px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
select{min-height:44px}
.exr{margin-top:18px}.exr h3{margin:0 0 2px;break-after:avoid}.exr table tr{break-inside:avoid}
details.ovs summary{list-style-position:inside}
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.wk{border:1px solid var(--line);border-radius:10px;padding:6px;min-height:70px}.wk.today{border-color:#f2a900;background:#fff9e0}.wkh{font-size:.8rem;color:var(--mute);margin-bottom:4px}
.wkit{display:block;width:100%;text-align:left;font-size:.8rem;padding:2px 6px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wkit.done{opacity:.6}.wkit.over{border-color:var(--late);color:var(--late)}.soon{color:var(--late)}.soon2{color:var(--warn)}
@media(max-width:700px){.wkgrid{grid-template-columns:minmax(0,1fr)}.wk.emp:not(.today){display:none}}
.fbk{background:#eef7ff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
.akey{background:#f0faf4;border-left:4px solid var(--ok);padding:3px 10px;margin-top:4px;border-radius:6px}
.mcell{display:flex;align-items:center;gap:4px;white-space:nowrap}
.rowact{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.rowact button{padding:1px 9px;font-size:.78rem;border-radius:99px}
.fillbox{max-width:320px;border:2px solid #9ad0f5!important;border-radius:10px}.fillbox.inl{display:inline-block;width:9em;max-width:60%;margin:0 4px;padding:3px 8px;vertical-align:baseline}.rewbox{width:100%;border:2px dashed #f2a900!important;border-radius:10px}.warnbox{border-color:#e0a000!important;background:#fff8d6}.qhint{margin:-4px 0 6px}
.rc{background:#fff;border:1px solid var(--line);border-left-width:6px;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}.res.rc:last-child{border:1px solid var(--line);border-left-width:6px}.rtitle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.rt{font-size:1.2rem;font-weight:800;line-height:1.3}.rt a{color:#1a5fb4;text-decoration:underline;text-underline-offset:3px}.rico{font-size:1.4rem}.rchip{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;color:#33415c}.rc .rdesc{margin-top:8px}
.gbb{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfdff}.gbadd{margin-top:8px;gap:6px}.gbadd button{border-radius:99px}.gtedit{border-collapse:collapse}.gtedit th,.gtedit td{padding:3px;vertical-align:top}.gtedit input{min-width:110px;width:100%}.gprevb{margin-top:8px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px}
.gt{border-collapse:collapse;width:100%;margin:10px 0}.gt th{background:#eaf4fd;font-weight:700}.gt th,.gt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.gt tbody tr:nth-child(even) td{background:#f8fbfe}
.gh{font-size:1.15rem;margin:18px 0 6px;color:#1a5fb4}.gp{margin:8px 0;line-height:1.6}.gtip{display:flex;gap:10px;background:#fff8d6;border-left:5px solid #f2a900;border-radius:10px;padding:10px 14px;margin:12px 0}
.gex{background:#eef9f1;border-left:5px solid #3aa66a;border-radius:10px;padding:8px 14px;margin:12px 0}.gexl{font-weight:700;font-size:.85rem;color:#2c7a52}.gex ul{margin:6px 0 2px 18px;padding:0}.gex li{margin:3px 0}.gfig{margin:12px 0}.gdet>summary{font-weight:700;padding:8px 0;font-size:1.02rem}.gbody{margin-top:4px}
.asgwrap{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.asgt{border-collapse:separate;border-spacing:0;min-width:420px;width:100%}
.asgt th,.asgt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;background:var(--surf)}
.asgt thead th{position:sticky;top:0;background:#eaf4fd;z-index:2}
.asgt th:first-child,.asgt td:first-child{position:sticky;left:0;z-index:1;min-width:170px;max-width:260px;border-right:1px solid var(--line)}
.asgt thead th:first-child{z-index:3}
.asgt tbody tr:nth-child(even) td{background:#f6fbff}
.asgt tbody tr:hover td{background:#fff6d6}
</style>

<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const day=86400000, iso=d=>new Date(d).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S,user=null,tab="todo",open=null,view=null;

S={teacher:{name:"Teacher"},students:[],tasks:[],subs:{},res:[]};
/* ===== Core: state, saving, status helpers ===== */
let st;const save=()=>{clearTimeout(st);st=setTimeout(pushAll,700)};
const endDay=d=>new Date(d+"T23:59:59").getTime();
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const sub=(t,s)=>S.subs[t+"_"+s]||{};
/* ===== Sorting (A to Z menus) ===== */
const SORT={stu:"az",ex:"newest",rsc:"az",st:"due",ov:"due",pg:"due"};
const SA=[["az","A to Z"],["za","Z to A"]];
const cmpName=(a,b)=>nrmS(a).localeCompare(nrmS(b),"vi",{numeric:true});
const byTitle=(key,f)=>(a,b)=>(SORT[key]==="za"?-1:1)*cmpName(f(a),f(b));
const sortSel=(id,key,opts)=>`<div><label for="${id}" class="sub" style="margin:0 6px 0 0">Sort</label><select id="${id}" data-srt="${key}" style="width:auto">${opts.map(([v,l])=>`<option value="${v}" ${SORT[key]===v?"selected":""}>${l}</option>`).join("")}</select></div>`;
const sortStudents=()=>{S.students.sort((a,b)=>(SORT.stu==="za"?-1:1)*cmpName(a.name,b.name))};
const dueOf=(t,sid)=>((t.dues||{})[sid])||t.due;
const lastDue=t=>t.assigned.reduce((m,id)=>{const d=dueOf(t,id);return d>m?d:m},t.due);
function status(t,sid){const b=sub(t.id,sid);
 if(b.status==="submitted")return b.at>endDay(dueOf(t,sid))?["late","Submitted late"]:["submitted","Submitted"];
 if(Date.now()>endDay(dueOf(t,sid)))return["overdue","Overdue"];
 const has=b.hs||(b.text&&b.text.trim())||(b.ans&&b.ans.some(x=>x!==null&&x!==""&&x!==undefined));
 return has?["draft","Draft saved"]:["todo","To do"];}
const badge=(s)=>`<span class="badge s-${s[0]}">${s[1]}</span>`;


function render(){
 const el=document.getElementById("app");
 if(!user){el.innerHTML=loginHTML();bind();bind5();return}
 el.innerHTML=`<div class="top"><b>Ms Anh’s Homework Portal</b>${topRight()}</div>`+(user.preview?`<div class="note" role="status">Read-only preview of what ${esc(user.name)} sees. Typing and submitting are turned off, and nothing is saved.</div>`:"")+(user.role==="teacher"?teacherHTML():studentHTML())+(view?modal():"");
 if(user.preview)freeze();
 bind();bind2();bind3();bind4();bind5();bind6();bindVocab();bind7();bind8();bind9();bind10();bind11();bind12();bind13();bind14();bind15();bind16();bind17();bind18();bind20();bind21();bind22();bind23();bindGB();bindFmt();trackOpen();
}
function lastName(){try{return localStorage.getItem("last_name")||""}catch(e){return""}}
function loginHTML(){return `<div class="login"><h1>Ms Anh’s Homework Portal</h1><p>Log in with your name and PIN.</p>
<div class="panel"><label for="n">Name</label><input id="n" autocomplete="username" value="${esc(lastName())}"><label for="p">PIN</label><div class="row" style="gap:6px;flex-wrap:nowrap"><input id="p" type="password" inputmode="numeric" autocomplete="current-password" style="flex:1"><button type="button" id="pineye" aria-label="Show PIN" aria-pressed="false">👁 Show</button></div>
<p id="err" class="wrong" role="alert"></p><button class="p" id="go">Log in</button>
<div class="hint">Forgot your PIN? Ask Ms Anh.</div></div></div>`}

/* ===== Student screens ===== */
function contTask(todo,id){let last=null;try{last=localStorage.getItem("last_ex_"+id)}catch(e){}
 const d=t=>status(t,id)[0]==="draft";
 return todo.find(t=>t.id===last&&d(t))||todo.find(d)||null}
function contHTML(todo,id){const t=contTask(todo,id);return t?`<div class="panel"><button class="p" data-open="${t.id}" id="cont">▶ Continue where you stopped: ${esc(t.title)}</button></div>`:""}
function studentHTML(){
 const id=user.id;
 const work=open?S.tasks.find(t=>t.id===open):null;if(open&&!work){open=null;if(tab==="work")tab="todo"}
 const mine=S.tasks.filter(t=>t.assigned.includes(id)&&!t.archived).sort((a,b)=>dueOf(a,id).localeCompare(dueOf(b,id)));
 const doneSt=x=>["submitted","late"].includes(status(x,id)[0])&&!sub(x.id,id).retry;
 const ordS=a=>SORT.st==="due"?a:a.slice().sort(byTitle("st",x=>x.title));
 const todo=ordS(mine.filter(t=>!doneSt(t))),done=ordS(mine.filter(doneSt));
 const list=a=>a.length?(a.length>1?`<div class="row" style="margin-bottom:10px">${sortSel("srt_st","st",[["due","Due date"],...SA])}</div>`:"")+a.map(t=>`<div class="task" data-open="${t.id}" tabindex="0" role="button"><div><h3>${esc(t.title)}</h3><div class="sub">Due ${fmt(dueOf(t,id))}${dueSoon(t,id)}</div></div>${sub(t.id,id).retry?`<span class="badge s-draft">Redo</span>`:badge(status(t,id))}${fbNew(t.id,id)?`<span class="badge s-submitted" style="margin-left:6px">New feedback</span>`:""}</div>`).join(""):`<div class="empty">Nothing here.</div>`;
 return `<div class="tabs"><button data-tab="todo" class="${tab==="todo"?"on":""}">To-do (${todo.length})</button><button data-tab="done" class="${tab==="done"?"on":""}">Submitted</button><button data-tab="prog" class="${tab==="prog"?"on":""}">My progress</button><button data-tab="res" class="${tab==="res"?"on":""}">Resources</button>${work?`<button data-tab="work" class="${tab==="work"?"on":""}">Doing: ${esc(work.title.length>22?work.title.slice(0,20)+"…":work.title)}</button>`:""}</div>`+
 (tab==="work"&&work?wordSearchHTML()+taskHTML(work,id):tab==="todo"?weekHTML(mine,id)+contHTML(todo,id)+`<div class="panel">${list(todo)}</div>`:tab==="done"?`<div class="panel">${list(done)}</div>`:tab==="prog"?myProgressHTML():resStudent());
}

/* ===== Teacher screens ===== */
function teacherHTML(){
 const tabs=[["ov","Overview"],["ex","Exercises"],["rsc","Resources"],["stu","Students"],["prog","Progress"],["rep","Parent reports"],["set","Settings"]];
 let h=`<div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div>`;
 if(tab==="ov"||tab==="todo"){
  h+=activeHTML()+overviewHTML();
 }else if(tab==="stu"){
  h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Students</h2>${sortSel("srt_stu","stu",SA)}</div><div class="scroll"><table><thead><tr><th>Name</th><th>PIN</th><th>Status</th><th>Open tasks</th><th>Late or overdue</th><th></th></tr></thead><tbody>`+S.students.map(s=>{const m=S.tasks.filter(t=>t.assigned.includes(s.id)&&!t.archived);return `<tr><td>${esc(s.name)}</td>${pinCell(s)}<td data-st="${s.id}">${statusInner(s)}</td><td>${m.filter(t=>!["submitted","late"].includes(status(t,s.id)[0])).length}</td><td>${m.filter(t=>["late","overdue"].includes(status(t,s.id)[0])).length}</td><td><button data-spin="${s.id}">Change PIN</button> <button data-sdel="${s.id}">Remove</button></td></tr>`}).join("")+`</tbody></table></div>
  <h3 style="margin-top:18px">Add a student</h3><div class="grid2"><div><label for="stn">Name</label><input id="stn"></div><div><label for="stp">PIN (at least 6 characters)</label><input id="stp" autocomplete="off"></div></div><p><button class="p" id="addst">Add student</button></p></div>`;

function gbTableFrom(txt){

 if(rows.length<1)throw new Error("There is nothing to turn into a table.");
 const n=Math.max(...rows.map(r=>r.length));
 if(n>8)throw new Error("Tables can have at most 8 columns. This one has "+n+".");
 if(rows.length>81)throw new Error("Tables can have at most 80 rows plus the heading row. This one has "+(rows.length-1)+" rows.");

let pushing=false,pushAgain=false;
async function pushAll(){
 if(pushing){pushAgain=true;return}
 pushing=true;
 try{await pushAllRun()}finally{pushing=false;if(pushAgain){pushAgain=false;save()}}
}
const sigEx=t=>JSON.stringify([t.title,t.desc||"",t.due,t.kind,t.lib!==false,!!t.archived,t.maxRetries??3,t.quiz?t.quiz.map(({a,...r})=>r):null,t.kind==="link"?(t.url||null):(t.html||null),!!t.shuffleQ,!!t.shuffleO]);
const sigKey=t=>JSON.stringify(t.quiz?t.quiz.map(x=>x.a??null):null);
const sigAsg=t=>JSON.stringify(t.assigned.slice().sort().map(s=>[s,(t.dues||{})[s]||null]));
const sigR=r=>JSON.stringify([r.title,r.type,r.url||null,r.words||null,r.description||"",r.to,r.notes||{}]);
let delRes=[];
async function pushAllRun(){
 if(!user||user.preview)return;
 try{
  if(user.role==="student"){
   for(const[k,b]of Object.entries(S.subs)){const i=k.indexOf("_");if(k.slice(i+1)!==user.id||(b.status==="submitted"&&!b.retry))continue;
    await q(sb.rpc("save_draft",{p_ex:k.slice(0,i),p_data:{ans:b.ans||[],text:b.text||null,hs:b.hs||null}}))}
  }else{
   if(delIds.length){await q(sb.from("exercises").delete().in("id",delIds));delIds=[]}
   if(delAssign.length){const by={};delAssign.forEach(x=>(by[x.e]=by[x.e]||[]).push(x.s));for(const[e,ids]of Object.entries(by))await q(sb.from("exercise_students").delete().eq("exercise_id",e).in("student_id",ids));delAssign=[]}
    /* Exercises: only what you changed is written, so an old open page cannot undo newer work. */
    S.exSig=S.exSig||{};S.kSig=S.kSig||{};S.aSig=S.aSig||{};
    const withShuf=S.tasks.some(t=>t.shuffleQ||t.shuffleO||t.hasShuf);
    const cx=S.tasks.filter(t=>S.exSig[t.id]!==sigEx(t));
    if(cx.length)await q(sb.from("exercises").upsert(cx.map(t=>{const r={id:t.id,title:t.title,descr:t.desc||"",due:t.due,kind:t.kind,in_library:t.lib!==false,archived:!!t.archived,retries:t.maxRetries??3,questions:t.quiz?t.quiz.map(({a,...r})=>r):null,html:t.kind==="link"?(t.url||null):(t.html||null)};if(withShuf){r.shuffle_q=!!t.shuffleQ;r.shuffle_o=!!t.shuffleO}return r})));
    const ck=S.tasks.filter(t=>t.quiz&&S.kSig[t.id]!==sigKey(t));
    if(ck.length)await q(sb.from("exercise_keys").upsert(ck.map(t=>({exercise_id:t.id,answers:t.quiz.map(x=>x.a??null)})),{onConflict:"exercise_id"}));
    const withDue=S.hasDue||S.tasks.some(t=>Object.keys(t.dues||{}).length);
    const ca=S.tasks.filter(t=>S.aSig[t.id]!==sigAsg(t));
    const es=ca.flatMap(t=>t.assigned.map(s=>withDue?{exercise_id:t.id,student_id:s,due:(t.dues||{})[s]||null}:{exercise_id:t.id,student_id:s}));
    if(es.length)await q(sb.from("exercise_students").upsert(es,{onConflict:"exercise_id,student_id"}));
    cx.forEach(t=>S.exSig[t.id]=sigEx(t));ck.forEach(t=>S.kSig[t.id]=sigKey(t));ca.forEach(t=>S.aSig[t.id]=sigAsg(t));
   /* Resources: only what you changed is written, nothing is wiped and re-created. */
   S.resSig=S.resSig||{};S.accKeys=S.accKeys||{};
   const chg=S.res.filter(r=>S.resSig[r.id]!==sigR(r));
   if(chg.length){
    await q(sb.from("resources").upsert(chg.map(r=>({id:r.id,title:r.title,type:r.type,url:r.url||null,words:r.words||null,description:r.description||null,to_all:r.to==="all"}))));
    const rows=[],keep={};
    chg.forEach(r=>{const ids=new Set([...(Array.isArray(r.to)?r.to:[]),...Object.keys(r.notes||{})]);keep[r.id]=[...ids];ids.forEach(i=>rows.push({resource_id:r.id,student_id:i,has_access:Array.isArray(r.to)&&r.to.includes(i),note:(r.notes||{})[i]||null}))});
    if(rows.length)await q(sb.from("resource_access").upsert(rows,{onConflict:"resource_id,student_id"}));
    for(const r of chg){const gone=(S.accKeys[r.id]||[]).filter(i=>!keep[r.id].includes(i));if(gone.length)await q(sb.from("resource_access").delete().eq("resource_id",r.id).in("student_id",gone))}
    chg.forEach(r=>{S.resSig[r.id]=sigR(r);S.accKeys[r.id]=keep[r.id]});
   }
   if(delRes.length){const g=delRes.slice();await q(sb.from("resources").delete().in("id",g));delRes=delRes.filter(x=>!g.includes(x))}
  }
  toast("Saved ✓");
 }catch(e){console.error(e);toast("Could not save: "+(e.message||e))}
}

let RST=null;
const rsKey=n=>String(n||"").trim().toLowerCase();
async function rsScan(bk){
 const T=bk.tables||{};
 const haveEx=new Set((await q(sb.from("exercises").select("id"))).map(x=>x.id));

 const stu=(T.profiles||[]).filter(p=>p.role==="student"&&!ids.has(p.id)&&!byName[rsKey(p.name)]).map(p=>({id:p.id,name:p.name,pin:pins[p.id]||""}));
 const ex=(T.exercises||[]).filter(e=>!haveEx.has(e.id)).map(e=>({id:e.id,title:e.title}));
 const res=(T.resources||[]).filter(r=>!haveRes.has(r.id)).map(r=>({id:r.id,title:r.title}));
 return{bk,stu,ex,res,pickStu:new Set(stu.filter(x=>x.pin).map(x=>x.id)),pickEx:new Set(ex.map(x=>x.id)),pickRes:new Set(res.map(x=>x.id)),msg:"",busy:false};

async function rsIns(t,rows,conflict){let n=0;for(let i=0;i<rows.length;i+=200){const r=await q(sb.from(t).upsert(rows.slice(i,i+200),{onConflict:conflict,ignoreDuplicates:true}).select());n+=(r||[]).length}return n}
async function rsRun(){
 const R=RST,T=R.bk.tables,log=[];
 let prof=await q(sb.from("profiles").select("id,name,role"));
 const known=new Set(prof.map(p=>p.id)),byName={};prof.forEach(p=>{byName[rsKey(p.name)]=p.id});
 const idmap={},fresh=new Set();
 (T.profiles||[]).filter(p=>p.role==="student").forEach(p=>{if(known.has(p.id))idmap[p.id]=p.id;else if(byName[rsKey(p.name)])idmap[p.id]=byName[rsKey(p.name)]});
 for(const s of R.stu.filter(x=>R.pickStu.has(x.id))){
  try{await manage({action:"create",name:s.name,pin:s.pin});
   prof=await q(sb.from("profiles").select("id,name,role"));const nw=prof.filter(p=>!known.has(p.id));
   if(nw.length===1){known.add(nw[0].id);idmap[s.id]=nw[0].id;fresh.add(s.id);log.push("Student “"+s.name+"” put back.")}
   else{nw.forEach(p=>known.add(p.id));log.push("Student “"+s.name+"” was created, but could not be matched to old work.")}
  }catch(e){log.push("Student “"+s.name+"” could not be created: "+(e.message||e))}
 }
 const haveEx=new Set((await q(sb.from("exercises").select("id"))).map(x=>x.id));
 const haveRes=new Set((await q(sb.from("resources").select("id"))).map(x=>x.id));
 const exRows=(T.exercises||[]).filter(e=>R.pickEx.has(e.id));
 const resRows=(T.resources||[]).filter(r=>R.pickRes.has(r.id));
 try{const n=exRows.length?await rsIns("exercises",exRows,"id"):0;exRows.forEach(e=>haveEx.add(e.id));if(n)log.push(n+" exercise(s) put back.")}catch(e){log.push("Exercises could not be restored: "+(e.message||e))}
 try{const k=(T.exercise_keys||[]).filter(x=>R.pickEx.has(x.exercise_id));if(k.length)await rsIns("exercise_keys",k,"exercise_id")}catch(e){log.push("Answer keys could not be restored: "+(e.message||e))}
 try{const n=resRows.length?await rsIns("resources",resRows,"id"):0;resRows.forEach(r=>haveRes.add(r.id));if(n)log.push(n+" resource(s) put back.")}catch(e){log.push("Resources could not be restored: "+(e.message||e))}
 const mapRows=(rows,idk,have,pickSet)=>rows.filter(r=>have.has(r[idk])&&idmap[r.student_id]&&(pickSet.has(r[idk])||fresh.has(r.student_id))).map(r=>({...r,student_id:idmap[r.student_id]}));
 const doTab=async(label,t,rows,conf)=>{if(!rows.length)return;try{const n=await rsIns(t,rows,conf);if(n)log.push(n+" "+label+" put back.")}catch(e){log.push(label[0].toUpperCase()+label.slice(1)+" could not be restored"+(/policy|permission|denied/i.test(e.message||"")?" (run update-16.sql in Supabase first)":"")+": "+(e.message||e))}};
 await doTab("assignment(s)","exercise_students",mapRows(T.exercise_students||[],"exercise_id",haveEx,R.pickEx),"exercise_id,student_id");
 await doTab("answer set(s)","submissions",mapRows(T.submissions||[],"exercise_id",haveEx,R.pickEx),"exercise_id,student_id");
 await doTab("feedback note(s)","feedback",mapRows(T.feedback||[],"exercise_id",haveEx,R.pickEx),"exercise_id,student_id,item");
 await doTab("resource access row(s)","resource_access",mapRows(T.resource_access||[],"resource_id",haveRes,R.pickRes),"resource_id,student_id");
 try{await loadAll(user.id,true)}catch(e){log.push("Restored, but the page could not refresh itself. Press Refresh.")}
 return log.length?log:["Nothing needed restoring."];
}

function bind(){
 const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
 if($("#out"))$("#out").onclick=()=>{user=null;open=null;view=null;tab="todo";render()};
 $$("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(!(user&&user.role==="student"))open=null;view=null;render()});
 $$("[data-open]").forEach(b=>{const f=()=>{open=b.dataset.open;tab="work";render()};b.onclick=f;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
 $$("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;render();document.querySelector("[role=region]").scrollIntoView({behavior:"smooth"})});
 if($("#close"))$("#close").onclick=()=>{view=null;render()};
 if($("#back"))$("#back").onclick=()=>{open=null;tab="todo";render()};
 const t=open&&S.tasks.find(x=>x.id===open);
 if(t){const k=t.id+"_"+user.id;
  const ens=()=>S.subs[k]=S.subs[k]||{};
  if($("#tx"))$("#tx").oninput=e=>{ens().text=e.target.value;save();$("#sv").textContent="Draft saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
  $$("input[type=radio]").forEach(r=>r.onchange=()=>{const b=ens();b.ans=b.ans||[];b.ans[+r.name.slice(1)]=+r.value;save()});
  $$("[data-fill]").forEach(r=>r.oninput=()=>{const b=ens();b.ans=b.ans||[];b.ans[+r.dataset.fill]=r.value;save()});
 }
}
